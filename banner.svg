<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
<title>veax Project</title>
<desc>Banniere animee de veax Project. Le grain est genere a l'affichage, il ne traverse aucune compression.</desc>
<defs>
  <!-- LES DEUX LUEURS.
       Des degrades a sept paliers remplacent le flou de 9,5 du template : un
       feGaussianBlur de ce rayon se recalcule a chaque image et coute cher,
       alors qu'un degrade ne coute rien et donne le meme bord. Les couleurs
       sont sombres (#4A3620, #2C2340) parce que les halos du template le sont :
       leur crete relevee sur le rendu vaut #3F2E1A et #362944, pas les couleurs
       vives du nuancier. C'est le flou et l'obscurcissement a 0,70 qui les
       delavent. -->
  <radialGradient id="ch"><stop offset="0" stop-color="#4A3620" stop-opacity="0.807"/><stop offset="0.16" stop-color="#4A3620" stop-opacity="0.663"/><stop offset="0.3" stop-color="#4A3620" stop-opacity="0.476"/><stop offset="0.45" stop-color="#4A3620" stop-opacity="0.289"/><stop offset="0.62" stop-color="#4A3620" stop-opacity="0.145"/><stop offset="0.8" stop-color="#4A3620" stop-opacity="0.051"/><stop offset="1" stop-color="#4A3620" stop-opacity="0.000"/></radialGradient>
  <radialGradient id="fr"><stop offset="0" stop-color="#2C2340" stop-opacity="1.045"/><stop offset="0.18" stop-color="#2C2340" stop-opacity="0.814"/><stop offset="0.34" stop-color="#2C2340" stop-opacity="0.550"/><stop offset="0.52" stop-color="#2C2340" stop-opacity="0.308"/><stop offset="0.72" stop-color="#2C2340" stop-opacity="0.121"/><stop offset="1" stop-color="#2C2340" stop-opacity="0.000"/></radialGradient>

  <!-- LE GRAIN, GENERE ET NON ENCODE.
       fractalNoise sur trois octaves donne un bruit fin et sans structure. Le
       feColorMatrix le desature entierement, puis n'en garde qu'une fraction en
       alpha : c'est cette fraction qui regle l'intensite. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="7"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0.22 0.22 0.22 0 -0.330"/>
  </filter>
</defs>

<rect width="1500" height="500" fill="#120F0A"/>

<!-- Les lueurs s'ADDITIONNENT, elles ne se recouvrent pas : le template
     accumule en lineaire (general.hdr = true), et c'est ce qui evite l'exces de
     rouge qu'un simple empilement en alpha produirait. mix-blend-mode/screen en
     est l'equivalent le plus proche qui fonctionne dans un <img>. -->
<g style="isolation:isolate">
  <ellipse cx="525" cy="160" rx="600" ry="475"
           fill="url(#ch)" style="mix-blend-mode:screen">
    <animate attributeName="cx" dur="17s" repeatCount="indefinite"
           calcMode="spline" keyTimes="0.0000;0.0588;0.1176;0.1765;0.2353;0.2941;0.3529;0.4118;0.4706;0.5294;0.5882;0.6471;0.7059;0.7647;0.8235;0.8824;0.9412;1.0000"
           keySplines=".42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1"
           values="528.0;639.0;699.0;747.0;841.5;943.5;996.0;991.5;861.0;681.0;517.5;534.0;549.0;475.5;354.0;327.0;390.0;528.0"/>
    <animate attributeName="cy" dur="17s" repeatCount="indefinite"
           calcMode="spline" keyTimes="0.0000;0.0588;0.1176;0.1765;0.2353;0.2941;0.3529;0.4118;0.4706;0.5294;0.5882;0.6471;0.7059;0.7647;0.8235;0.8824;0.9412;1.0000"
           keySplines=".42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1"
           values="160.0;147.0;167.5;162.5;185.0;223.5;262.5;298.0;314.0;320.0;323.0;314.0;283.5;228.5;169.0;193.5;205.0;160.0"/>
  </ellipse>
  <ellipse cx="1095" cy="305" rx="540" ry="440"
           fill="url(#fr)" style="mix-blend-mode:screen">
    <animate attributeName="cx" dur="17s" repeatCount="indefinite"
           calcMode="spline" keyTimes="0.0000;0.0588;0.1176;0.1765;0.2353;0.2941;0.3529;0.4118;0.4706;0.5294;0.5882;0.6471;0.7059;0.7647;0.8235;0.8824;0.9412;1.0000"
           keySplines=".42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1"
           values="1092.0;1066.5;1009.5;972.0;967.5;991.5;1030.5;1024.5;970.5;853.5;756.0;738.0;802.5;903.0;1005.0;1045.5;1075.5;1092.0"/>
    <animate attributeName="cy" dur="17s" repeatCount="indefinite"
           calcMode="spline" keyTimes="0.0000;0.0588;0.1176;0.1765;0.2353;0.2941;0.3529;0.4118;0.4706;0.5294;0.5882;0.6471;0.7059;0.7647;0.8235;0.8824;0.9412;1.0000"
           keySplines=".42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1 .42 0 .58 1"
           values="304.0;291.5;287.5;283.5;242.0;188.0;136.5;114.0;128.5;177.5;206.5;215.0;225.5;243.5;249.5;267.5;289.0;304.0"/>
  </ellipse>
</g>

<!-- le grain couvre tout le fond, mais passe SOUS le mot : dans le template le
     bruit est applique au fond, le nom est pose ensuite -->
<rect width="1500" height="500" filter="url(#grain)" opacity="0.65"/>

